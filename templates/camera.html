<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NEXTRAJ Camera AI</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

<style>

body{

background:#0f172a;
color:white;
font-family:Arial;
text-align:center;
margin:0;

}

.container{

padding:30px;

}

video{

width:90%;
max-width:700px;

border-radius:20px;

border:4px solid #00ffd5;

box-shadow:0 0 30px cyan;

}

canvas{

display:none;

}

button{

margin:10px;

padding:15px 25px;

font-size:18px;

border:none;

border-radius:12px;

cursor:pointer;

background:#00ffd5;

font-weight:bold;

}

button:hover{

background:#00c5a7;

}

#answer{

margin-top:25px;

font-size:20px;

line-height:1.6;

}

</style>

</head>

<body>

<div class="container">

<h1>🤖 NEXTRAJ Camera AI</h1>

<p>

Show anything to the camera and ask AI.

</p>

<video
id="video"
autoplay
playsinline>
</video>

<canvas
id="canvas">
</canvas>

<br>
<!-- Camera Buttons -->

<button onclick="startCamera()">
🎥 Start Camera
</button>

<button onclick="captureImage()">
📸 Capture
</button>

<button onclick="window.location='/'">
🏠 Back
</button>

<br><br>

<div id="answer">

AI response will appear here...

</div>

</div>
<script src="{{ url_for('static', filename='js/camera.js') }}"></script>

</body>

</html>
